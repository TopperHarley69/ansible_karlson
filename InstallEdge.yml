- name: Install Edge
  hosts: deploys
  gather_facts: yes
  become: yes
  become_user: administrator

  tasks:
    - name: InstallEdge
      win_package:
        path: \\fileserver\Downloads\SW\Edge\MicrosoftEdgeEnterpriseX64.msi
        state: present
        arguments: /qn
     - debug:
        msg: "{{ script_return }}"
