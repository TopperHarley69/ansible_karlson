---
- name: Download MSI to Linux controller
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Remove file
      ansible.builtin.file:
        path: /var/lib/software/MicrosoftEdgeEnterpriseX64.msi
        state: absent
    - name: Fetch MSI file
      get_url:
        url: https://go.microsoft.com/fwlink/?linkid=2093437
        dest: /var/lib/software/MicrosoftEdgeEnterpriseX64.msi
        mode: "0644"
