

---
- name: Scan Windows host using wsusscn2.cab
  hosts: windows
  gather_facts: false

  tasks:
    - name: Copy SW
      ansible.windows.win_copy:
        src: /var/lib/software/wsusscn2.cab
        dest: c:\temp
    - name: Search for applicable updates from offline WSUS catalog
      ansible.windows.win_powershell:
        script: |
          $UpdateSession = New-Object -ComObject Microsoft.Update.Session
          $UpdateServiceManager = New-Object -ComObject Microsoft.Update.ServiceManager
          $UpdateService = $UpdateServiceManager.AddScanPackageService(
              "Offline Sync Service",
              "C:\temp\wsusscn2.cab"
          )

          $UpdateSearcher = $UpdateSession.CreateUpdateSearcher()

          Write-Host "Searching for updates..."

          $UpdateSearcher.ServerSelection = 3
          $UpdateSearcher.ServiceID = [string]$UpdateService.ServiceID

          $SearchResult = $UpdateSearcher.Search("IsInstalled=0")

          if ($SearchResult.Updates.Count -eq 0) {
              Write-Output "There are no applicable updates."
              exit 0
          }

          $Updates = @()

          for ($i = 0; $i -lt $SearchResult.Updates.Count; $i++) {
              $Update = $SearchResult.Updates.Item($i)

              $Updates += [PSCustomObject]@{
                  Index = $i + 1
                  Title = $Update.Title
              }
          }

          $Updates | ConvertTo-Json -Depth 3

      register: wsus_scan

    - name: Display applicable updates
      ansible.builtin.debug:
        msg: "{{ wsus_scan }}"
