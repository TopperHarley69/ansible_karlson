---
- name: Install OOB patch
  hosts: deploys
  gather_facts: yes
  tasks:
    - name: Copy SW
      ansible.windows.win_copy:
        src: /var/lib/software/oob/windows11.0-kb5136489-x64_258bf1c4013bd40f3f019fb11e41b5acc403614f.msu
        dest: c:\windows\temp\windows11.0-kb5136489-x64_258bf1c4013bd40f3f019fb11e41b5acc403614f.msu
    - name: Install hotfix without validating the KB and Identifier
      ansible.windows.win_shell: |
        $packagePath = "c:\windows\temp\windows11.0-kb5136489-x64_258bf1c4013bd40f3f019fb11e41b5acc403614f.msu"
        $extension = [System.IO.Path]::GetExtension($packagePath).ToLower()

        if ($extension -eq '.msu') {
          $exe = 'wusa.exe'
          $args = @($packagePath, '/quiet', '/norestart')
        } elseif ($extension -eq '.msi') {
          $exe = 'msiexec.exe'
          $args = @('/i', $packagePath, '/quiet', '/norestart')
        } else {
          $exe = 'dism.exe'
          $args = @('/Online', '/Add-Package', "/PackagePath:$packagePath", '/Quiet', '/NoRestart')
        }

        $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
        $exitCode = [int]$process.ExitCode

