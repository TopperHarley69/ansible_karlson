- name: Install Edge
  hosts: deploys
  gather_facts: yes
  become: yes
  become_user: administrator

  tasks:
    - name: Copy SW
      ansible.windows.win_copy:
        src: \\fileserver\Downloads\SW\Edge\MicrosoftEdgeEnterpriseX64.msi
        dest: c:\temp

    - name: InstallEdge
      win_package:
        path: c:\temp\MicrosoftEdgeEnterpriseX64.msi
        state: present
        arguments: /qn
